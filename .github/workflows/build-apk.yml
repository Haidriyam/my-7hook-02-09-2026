name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Wrapper Executable
      run: |
        npm install -g corepack 2>/dev/null || true
        # Ensure gradlew executable exists
        if [ ! -f ./gradlew ]; then
          curl -sLo gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew
        fi
        chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 7Hooks-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
